[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils"
version = "0.1.0"
description = "A small Python library for common text-processing utilities."
readme = "README.md"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["textutils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
